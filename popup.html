<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1 style="
  font-family: 'Georgia', serif;
  font-size: 20px;
  text-align: center;
  text-shadow: 0 0 12px rgba(255, 111, 174, 0.35);
">Only for
  <span style="
  color: #ff6fae;
  font-family: 'Georgia', serif;
  font-size: 25px;
  text-align: center;
  text-shadow: 0 0 12px rgba(255, 111, 174, 0.35);
">🌸 Pearl 🌸</span> 
</h1>
    </div>
    <span id="status" class="pill pill--idle">checking…</span>
  </header>

  <section id="gate" class="hidden">
    <div class="gate-card">
      <div class="gate-icon">⚠️</div>
      <p class="warn">Please open <b>instagram.com</b>, ensure you are logged in, then <b>reload the page tab</b> and reopen this popup.</p>
    </div>
  </section>

  <section id="main" class="hidden">
    <div class="row action-toolbar">
      <button id="btnLoad" class="primary">1 · Load chats</button>
      <button id="btnWidget" class="secondary" title="Open floating widget directly on Instagram page">💬 Float UI</button>
      <button id="btnStop" class="danger" disabled>Stop</button>
    </div>

    <div id="threadsWrap" class="hidden">
      <label class="lbl">2 · Pick a conversation</label>
      <input id="filter" type="text" placeholder="🔍 Search name or @username…" />
      <ul id="threads" class="list"></ul>
    </div>

    <div id="chatWrap" class="hidden">
      <div class="chatHead">
        <div>
          <strong id="chatTitle">—</strong>
          <span id="chatSub" class="muted"></span>
        </div>
      </div>
      <div class="row">
        <button id="btnUnsendAll" class="primary">Unsend Messages (up to 100)</button>
      </div>
      <ul id="messages" class="list list--msgs"></ul>
    </div>

    <details id="logWrap">
      <summary>Activity Log</summary>
      <pre id="log"></pre>
    </details>
  </section>

  <script src="popup.js"></script>
</body>
</html>
